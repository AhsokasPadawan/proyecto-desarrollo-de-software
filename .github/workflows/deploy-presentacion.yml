name: Deploy Presentacion and Proyect to GitHub Pages

on:
  push:
    branches: ["main", "javis-playground"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build Presentacion
        working-directory: ./presentacion
        run: |
          npm install
          npm run build

      - name: Install and Build Proyect (Chess Game)
        working-directory: ./proyect
        run: |
          npm install
          npm run build

      - name: Combine Presentacion (/) and Proyect (/juego) into _site
        run: |
          mkdir -p _site/juego
          cp -r presentacion/dist/* _site/
          cp -r proyect/dist/* _site/juego/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
